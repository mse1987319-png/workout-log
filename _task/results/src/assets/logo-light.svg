<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150" width="1000" height="300">
  <defs>
    <!-- Cyan to Neon Green Gradient -->
    <linearGradient id="neonGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#00FF87" />
    </linearGradient>

    <!-- The word follows the page theme: dark slate on light, white on dark. -->
    <style>
      .wordmark { fill: #FFFFFF; }
      
    </style>
  </defs>

  <!-- Logo Icon -->
  <g transform="translate(15, 10)">
    <!-- Chart 'L' Axis -->
    <path d="M 20,10 L 20,110 C 20,115.5 24.5,120 30,120 L 120,120" fill="none" stroke="url(#neonGradient)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Upward Trend Barbell -->
    <g transform="translate(75, 75) rotate(-45)">
      <!-- Main Bar -->
      <rect x="-45" y="-5" width="90" height="10" rx="5" fill="url(#neonGradient)" />
      
      <!-- Left Inner Plate -->
      <rect x="-28" y="-20" width="8" height="40" rx="3" fill="url(#neonGradient)" />
      <!-- Left Outer Plate -->
      <rect x="-40" y="-14" width="8" height="28" rx="3" fill="url(#neonGradient)" />
      
      <!-- Right Inner Plate -->
      <rect x="20" y="-20" width="8" height="40" rx="3" fill="url(#neonGradient)" />
      <!-- Right Outer Plate -->
      <rect x="32" y="-14" width="8" height="28" rx="3" fill="url(#neonGradient)" />
    </g>
  </g>

  <!-- Typography -->
  <!-- Note: Fill is set to dark slate (#1E293B). Change to #FFFFFF for dark backgrounds. -->
  <text class="wordmark" x="160" y="105" font-family="&#39;Inter&#39;, &#39;Helvetica Neue&#39;, Helvetica, Arial, sans-serif" font-size="82" font-weight="800" fill="#1E293B" letter-spacing="-2">Logify</text>
</svg>