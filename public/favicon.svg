<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Background Gradient for App Icon (Optional) -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </radialGradient>

    <!-- Cyan to Neon Green Brand Gradient -->
    <linearGradient id="brandGrad" x1="15%" y1="90%" x2="85%" y2="10%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#00FF87" />
    </linearGradient>

    <!-- Drop Shadow / Glow for High-Contrast Depth -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00E5FF" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Layer (Ideal for App Icon/Mobile, omit/make transparent for tiny favicons) -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- Monogram Brand Mark -->
  <g transform="translate(48, 44)" filter="url(#glow)">
    <!-- Base Progress 'L' and Charting Element -->
    <path d="M 64,52 L 64,340 C 64,357.6 78.4,372 96,372 L 340,372" fill="none" stroke="url(#brandGrad)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Rising Data Trend Graph -->
    <path d="M 74,332 L 140,240 L 210,290 L 330,120" fill="none" stroke="url(#brandGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Upward-Trending Barbell (Transformed 45 Degrees) -->
    <g transform="translate(262, 185) rotate(-45)">
      <!-- Main Bar -->
      <rect x="-105" y="-12" width="210" height="24" rx="12" fill="url(#brandGrad)" />
      
      <!-- Left Inner Plate -->
      <rect x="-65" y="-48" width="18" height="96" rx="7" fill="url(#brandGrad)" />
      <!-- Left Outer Plate -->
      <rect x="-93" y="-33" width="18" height="66" rx="7" fill="url(#brandGrad)" />
      
      <!-- Right Inner Plate -->
      <rect x="47" y="-48" width="18" height="96" rx="7" fill="url(#brandGrad)" />
      <!-- Right Outer Plate -->
      <rect x="75" y="-33" width="18" height="66" rx="7" fill="url(#brandGrad)" />
    </g>
  </g>
</svg>